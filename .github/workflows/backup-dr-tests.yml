name: Backup recovery contract tests

on:
  push:
    branches: [test/chore/dr-restore]
  pull_request:
    paths:
      - tests/backup/**
      - infrastructure/backup/**
      - .github/workflows/backup-dr-tests.yml

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Resolve implementation dependency
        id: implementation
        shell: bash
        run: |
          set -euo pipefail
          if test -f infrastructure/backup/backup.py; then
            echo 'path=infrastructure/backup/backup.py' >> "$GITHUB_OUTPUT"
            echo 'Testing implementation in this checkout.'
          else
            sha=$(git ls-remote https://github.com/lekeanyiKerring/Distributed-Waste-Management-System.git refs/heads/feat/chore/backup-dr | cut -f1)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'FAIL: IMP branch is unavailable'; exit 1; }
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo 'path=.feature8-implementation/infrastructure/backup/backup.py' >> "$GITHUB_OUTPUT"
            echo "Testing pending IMP commit: $sha"
          fi
      - name: Check out resolved pending implementation
        if: steps.implementation.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          repository: lekeanyiKerring/Distributed-Waste-Management-System
          ref: ${{ steps.implementation.outputs.sha }}
          path: .feature8-implementation
          persist-credentials: false
      - run: python -m pip install ruff==0.11.13 mypy==1.15.0
      - run: ruff check tests/backup && ruff format --check tests/backup
      - run: mypy tests/backup
      - name: Run six real PostGIS recovery tests
        env:
          DWMS_RUN_DR_INTEGRATION: '1'
          DWMS_BACKUP_TOOL: ${{ github.workspace }}/${{ steps.implementation.outputs.path }}
        run: python -m unittest discover -s tests/backup -p 'test_*.py' -v
